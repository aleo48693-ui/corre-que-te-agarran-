<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Corre que te agarran</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#87CEEB;font-family:sans-serif}
#game{width:100%;height:100vh;position:relative;background:linear-gradient(#87CEEB 60%, #7ED957 60%)}
#player{position:absolute;bottom:60px;left:50px;font-size:50px;z-index:5}
#police{position:absolute;bottom:60px;left:0px;font-size:50px;z-index:4}
#floor{position:absolute;bottom:0;width:100%;height:60px;background:#8B4513}
#hud{position:absolute;top:15px;left:15px;right:15px;z-index:10}
.box{background:#fff;padding:10px 20px;border-radius:25px;font-weight:900;font-size:18px;box-shadow:0 3px 6px rgba(0,0,0,0.3)}
#score{float:left}
#coins{float:right;background:gold}
#startText{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:900;color:#fff;text-shadow:2px 2px 4px #000;z-index:10}
#gameOver{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:100}
#box{ background:#fff;padding:30px;border-radius:15px;text-align:center}
.btn{background:#4CAF50;color:#fff;border:0;padding:18px 30px;margin:10px 0;border-radius:10px;font-size:18px;font-weight:900;width:100%}
.btnMp{background:#009EE3}
#cafecito{position:fixed;bottom:15px;left:15px;z-index:20;background:#009EE3;color:#fff;border:0;padding:14px 24px;border-radius:30px;font-size:17px;font-weight:900;box-shadow:0 3px 6px rgba(0,0,0,0.3)}
</style>
</head>
<body>
<div id="game" onclick="accion()">
    <div id="hud">
        <div id="score" class="box">Puntos: 0</div>
        <div id="coins" class="box">💰 0</div>
    </div>
    <div id="startText">TOCÁ PARA EMPEZAR</div>
    <div id="police">👮</div>
    <div id="player">🏃</div>
    <div id="floor"></div>
    <button id="cafecito" onclick="donar(event)">☕ Invitame un café</button>
</div>

<div id="gameOver">
    <div id="box">
        <h2 style="margin:0 0 10px 0">¡Te agarraron!</h2>
        <p style="font-size:20px;margin:10px 0">Puntaje: <b id="puntosFinal">0</b></p>
        <button class="btn" onclick="reiniciar()">JUGAR DE NUEVO</button>
    </div>
</div>

<script>
// PEGÁ TU LINK DE MERCADO PAGO ACÁ CUANDO LO TENGAS
const LINK_MP = "https://www.mercadopago.com.ar";

let jugando=false, saltando=false, puntos=0, monedas=0;
let playerY=60, policeX=0, velocidad=4;
let player=document.getElementById('player');
let police=document.getElementById('police');

if(localStorage.monedas) monedas=parseInt(localStorage.monedas);
document.getElementById('coins').innerHTML='💰 '+monedas;

function accion(){
    if(!jugando){ empezar(); return; }
    if(!saltando){
        saltando=true;
        playerY=180;
        player.style.bottom=playerY+'px';
        setTimeout(()=>{
            playerY=60;
            player.style.bottom=playerY+'px';
            saltando=false;
        },450);
    }
}

function loop(){
    if(!jugando) return;
    puntos++;
    document.getElementById('score').innerHTML='Puntos: '+puntos;
    
    policeX+=velocidad;
    police.style.left=policeX+'px';
    
    // Si el poli te toca y no saltaste = perdiste
    if(policeX>25 && policeX<75 && playerY<100){
        perder();
    }else{
        velocidad+=0.002;
        requestAnimationFrame(loop);
    }
}

function empezar(){
    jugando=true;
    puntos=0;
    policeX=-60;
    velocidad=4;
    document.getElementById('startText').style.display='none';
    document.getElementById('gameOver').style.display='none';
    loop();
}

function perder(){
    jugando=false;
    document.getElementById('puntosFinal').innerText=puntos;
    document.getElementById('gameOver').style.display='flex';
    monedas+=Math.floor(puntos/10);
    localStorage.monedas=monedas;
    document.getElementById('coins').innerHTML='💰 '+monedas;
}

function reiniciar(){
    empezar();
}

function donar(e){
    e.stopPropagation();
    window.open(LINK_MP,'_blank');
}
</script>
</body>
</html>
