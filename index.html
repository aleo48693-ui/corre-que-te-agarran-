<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Turbo Escape PRO</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#0a;font-family:'Arial Black',Arial;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#game{width:100%;height:100vh;position:relative;background:linear-gradient(180deg,#0f0c29 0%,#302b63 50%,#24243e 100%);touch-action:manipulation}
#road{position:absolute;width:100%;height:200%;left:0;top:-100%;background:repeating-linear-gradient(0deg,#1a1a1a 0px,#1a1a1a 60px,#222 60px,#222 120px);animation:scroll 0.3s linear infinite}
@keyframes scroll{0%{transform:translateY(0)}100%{transform:translateY(120px)}}
.lane{position:absolute;width:8px;height:100%;background:repeating-linear-gradient(0deg,#ffeb3b 0px,#ffeb3b 40px,transparent 40px,transparent 80px);opacity:0.9;filter:drop-shadow(0 0 10px #ffeb3b)}
#player{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);font-size:65px;z-index:10;transition:left 0.12s;filter:drop-shadow(0 0 20px #00f)}
#conductor{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:32px;display:none;animation:asomar 0.3s}
@keyframes asomar{0%{transform:translateX(-50%) translateY(25px)}100%{transform:translateX(-50%) translateY(0)}}
.car{position:absolute;font-size:65px;z-index:9;filter:drop-shadow(0 0 12px rgba(255,0,0,0.7))}
.coin{position:absolute;font-size:48px;z-index:8;animation:spin 0.8s linear infinite,glow 1s ease-in-out infinite}
@keyframes spin{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 8px gold)}50%{filter:drop-shadow(0 0 20px gold)}}
#hud{position:absolute;top:15px;left:15px;right:15px;z-index:20;pointer-events:none}
.box{background:linear-gradient(135deg,rgba(20,20,20,0.95),rgba(40,40,0.95));padding:8px 15px;border-radius:30px;font-weight:900;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,0.6);border:2px solid rgba(255,255,255,0.2);color:#fff}
#score{float:left;border-color:#00bcd4}
#coins{float:right;background:linear-gradient(135deg,#ffd700,#ff9800);color:#000;border-color:gold}
#lives{position:absolute;top:50px;left:15px;background:linear-gradient(135deg,#f44336,#d32f2f);border-color:#ff5555}
#level{position:absolute;top:90px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#00bcd4,#0097a7);border-color:#00ffff;font-size:12px}
#mision{position:absolute;top:130px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#4caf50,#388e3c);border-color:#00ff00;font-size:11px;max-width:80%}
#racha{position:absolute;top:170px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ff6b6b,#ee5a6f);border-color:#ff0000;font-size:11px}
#menuBtn{position:absolute;top:15px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ff9800,#f57c00);border-color:orange;padding:10px 25px;font-size:16px;cursor:pointer;pointer-events:all;z-index:21}
#startText{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:900;color:#fff;text-shadow:0 0 25px #00bcd4,3px 3px 6px #000;z-index:5;text-align:center;line-height:1.6;pointer-events:none}
.explosion{position:absolute;font-size:90px;animation:boom 0.6s;z-index:15}
@keyframes boom{0%{transform:scale(0) rotate(0deg)}50%{transform:scale(2.2) rotate(180deg)}100%{transform:scale(1) rotate(360deg);opacity:0}}
.risa{position:absolute;top:-45px;left:50%;transform:translateX(-50%);font-size:28px;font-weight:900;color:#ffeb3b;text-shadow:0 0 10px #ff9800,2px 2px 4px #000;animation:subir 0.6s;pointer-events:none}
@keyframes subir{0%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-50px)}}
.notif{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#4caf50,#388e3c);color:#fff;padding:25px 40px;border-radius:15px;font-size:24px;font-weight:900;z-index:300;display:none;animation:popIn 0.5s;box-shadow:0 0 30px rgba(76,175,80,0.8)}
@keyframes popIn{0%{transform:translate(-50%,-50%) scale(0)}50%{transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(-50%,-50%) scale(1)}}
#gameOver{position:fixed;inset:0;background:rgba(0,0,0,0.97);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(5px)}
#box{background:linear-gradient(135deg,#fff,#f5f5f5);padding:35px;border-radius:20px;text-align:center;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,0.5)}
.btn{background:linear-gradient(135deg,#4CAF50,#45a049);color:#fff;border:0;padding:20px 35px;margin:12px 0;border-radius:12px;font-size:19px;font-weight:900;width:100%;box-shadow:0 4px 15px rgba(76,175,80,0.4);cursor:pointer}
</style>
</head>
<body>
<div id="game">
    <div id="road">
        <div class="lane" style="left:25%"></div>
        <div class="lane" style="left:50%"></div>
        <div class="lane" style="left:75%"></div>
    </div>
    <div id="hud">
        <div id="score" class="box">KM: 0</div>
        <div id="coins" class="box">💰 0</div>
        <div id="lives" class="box">❤️ 1</div>
        <div id="level" class="box">NIVEL 1</div>
        <div id="mision" class="box">🎯 Misión: Juntá 20 monedas</div>
        <div id="racha" class="box">🔥 Racha: 1 día</div>
    </div>
    <button id="menuBtn" class="box" onclick="reiniciar()">🔄 REINICIAR</button>
    <div id="startText">🏎️ TURBO ESCAPE PRO 🏎️<br>TOCÁ LA PANTALLA PARA JUGAR<br>EL JUEGO NO PARA</div>
    <div id="player">
        🏎️
        <div id="conductor">😂</div>
    </div>
</div>

<div id="gameOver">
    <div id="box">
        <h2 style="margin:0 0 15px 0;font-size:28px;color:#000">💥 CHOQUE 💥</h2>
        <p style="font-size:22px;margin:12px 0;color:#000">Distancia: <b id="kmFinal">0</b> KM</p>
        <p style="font-size:20px;margin:12px 0;color:#000">Monedas: <b id="monedasFinal">0</b> 💰</p>
        <p style="font-size:18px;margin:12px 0;color:#9c27b0">Nivel alcanzado: <b id="nivelFinal">1</b></p>
        <button class="btn" onclick="reiniciar()">🔄 JUGAR DE NUEVO</button>
    </div>
</div>

<div class="notif" id="notif"></div>

<script>
let jugando=false, km=0, monedas=0, vidas=1, nivel=1;
let carril=1, enemigos=[], monedasMapa=[];
let velocidad=7, gameLoop=null, riendose=false;
let player=document.getElementById('player');
let conductor=document.getElementById('conductor');
let game=document.getElementById('game');
let ultimosSpawn=0;
let misionActual={tipo:'monedas', objetivo:20, progreso:0, recompensa:50};

if(localStorage.monedas) monedas=parseInt(localStorage.monedas);
document.getElementById('coins').innerHTML='💰 '+monedas;

// FIX CLAVE PARA IPHONE: onclick directo en el div
document.getElementById('game').onclick = function(e) {
    if(!jugando){ 
        empezar(); 
        return; 
    }
    let x = e.clientX || (e.touches && e.touches[0].clientX);
    let mitad = window.innerWidth / 2;
    if(x < mitad){ mover(-1); } else { mover(1); }
};

function mover(dir){
    let nuevoCarril = Math.max(0, Math.min(2, carril + dir));
    if(nuevoCarril !== carril){
        carril = nuevoCarril;
        let pos = [12.5, 50, 87.5][carril];
        player.style.left = pos + '%';
        if(!riendose){
            riendose = true;
            conductor.style.display = 'block';
            let risa = document.createElement('div');
            risa.className = 'risa';
            risa.innerHTML = 'JA JA! 😂';
            player.appendChild(risa);
            setTimeout(()=>risa.remove(), 600);
            setTimeout(()=>{
                conductor.style.display = 'none';
                riendose = false;
            }, 400);
        }
    }
}

function crearEnemigo(){
    const tipos = ['🏎️','🚗','🚙','🚘','🚔','🚖'];
    const enemigo = document.createElement('div');
    enemigo.className = 'car';
    enemigo.innerHTML = tipos[Math.floor(Math.random()*tipos.length)];
    let carrilEnemigo = Math.floor(Math.random()*3);
    enemigo.style.left = [12.5, 50, 87.5][carrilEnemigo] + '%';
    enemigo.style.top = '-80px';
    enemigo.dataset.carril = carrilEnemigo;
    game.appendChild(enemigo);
    enemigos.push({el:enemigo, y:-80, carril:carrilEnemigo});
}

function crearMoneda(){
    const moneda = document.createElement('div');
    moneda.className = 'coin';
    moneda.innerHTML = '💰';
    let carrilMoneda = Math.floor(Math.random()*3);
    moneda.style.left = [12.5, 50, 87.5][carrilMoneda] + '%';
    moneda.style.top = '-60px';
    moneda.dataset.carril = carrilMoneda;
    game.appendChild(moneda);
    monedasMapa.push({el:moneda, y:-60, carril:carrilMoneda});
}

function iniciarLoop(){
    if(gameLoop) clearInterval(gameLoop);
    gameLoop = setInterval(() => {
        if(!jugando) return;
        
        km++;
        let nuevoNivel = Math.floor(km/500) + 1;
        if(nuevoNivel > nivel){
            nivel = nuevoNivel;
            document.getElementById('level').innerHTML='NIVEL '+nivel;
            mostrarNotif('🎉 NIVEL '+nivel);
        }
        document.getElementById('score').innerHTML='KM: '+Math.floor(km/10);
        
        enemigos.forEach((e,i)=>{
            e.y += velocidad + nivel*0.5;
            e.el.style.top = e.y + 'px';
            if(e.y > window.innerHeight-200 && e.y < window.innerHeight-100 && e.carril === carril){
                chocar(e);
            }
            if(e.y > window.innerHeight){
                e.el.remove();
                enemigos.splice(i,1);
            }
        });
        
        monedasMapa.forEach((m,i)=>{
            m.y += velocidad + nivel*0.5;
            m.el.style.top = m.y + 'px';
            if(m.y > window.innerHeight-200 && m.y < window.innerHeight-100 && m.carril === carril){
                monedas++;
                document.getElementById('coins').innerHTML='💰 '+monedas;
                localStorage.monedas=monedas;
                misionActual.progreso++;
                actualizarMision();
                m.el.remove();
                monedasMapa.splice(i,1);
            }
            if(m.y > window.innerHeight){
                m.el.remove();
                monedasMapa.splice(i,1);
            }
        });
        
        ultimosSpawn++;
        if(ultimosSpawn > 35 - nivel*2){
            if(Math.random() < 0.25) crearEnemigo();
            if(Math.random() < 0.6) crearMoneda();
            ultimosSpawn = 0;
        }
        
        velocidad += 0.0003;
    }, 16);
}

function chocar(enemigo){
    jugando=false;
    vidas--;
    document.getElementById('lives').innerHTML='❤️ '+vidas;
    clearInterval(gameLoop);
    gameLoop=null;
    
    const exp = document.createElement('div');
    exp.className='explosion';
    exp.innerHTML='💥';
    exp.style.left=enemigo.el.style.left;
    exp.style.bottom='120px';
    game.appendChild(exp);
    setTimeout(()=>exp.remove(),600);
    
    enemigo.el.remove();
    enemigos = enemigos.filter(e=>e!==enemigo);
    
    if(vidas <= 0){
        gameOver();
    }
}

function empezar(){
    jugando=true;
    km=0; vidas=1; carril=1; velocidad=7; nivel=1;
    enemigos.forEach(e=>e.el.remove());
    monedasMapa.forEach(m=>m.el.remove());
    enemigos=[]; monedasMapa=[];
    document.getElementById('startText').style.display='none';
    document.getElementById('gameOver').style.display='none';
    document.getElementById('lives').innerHTML='❤️ 1';
    player.style.left='50%';
    misionActual={tipo:'monedas', objetivo:20, progreso:0, recompensa:50};
    actualizarMision();
    iniciarLoop();
}

function actualizarMision(){
    document.getElementById('mision').innerHTML='🎯 '+misionActual.progreso+'/'+misionActual.objetivo+' 💰';
    if(misionActual.progreso >= misionActual.objetivo){
        monedas += misionActual.recompensa;
        document.getElementById('coins').innerHTML='💰 '+monedas;
        localStorage.monedas=monedas;
        mostrarNotif('🎯 MISIÓN COMPLETADA! +'+misionActual.recompensa+' 💰');
        misionActual.objetivo += 10;
        misionActual.progreso = 0;
        misionActual.recompensa += 25;
    }
}

function gameOver(){
    document.getElementById('kmFinal').innerText=Math.floor(km/10);
    document.getElementById('monedasFinal').innerText=monedas;
    document.getElementById('nivelFinal').innerText=nivel;
    document.getElementById('gameOver').style.display='flex';
}

function mostrarNotif(texto){
    let notif = document.getElementById('notif');
    notif.innerText = texto;
    notif.style.display = 'block';
    setTimeout(()=>notif.style.display='none', 2000);
}

function reiniciar(){
    empezar();
}
</script>
</body>
</html>
